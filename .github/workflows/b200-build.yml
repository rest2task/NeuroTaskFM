name: b200-build

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  b200-build:
    runs-on: [self-hosted, linux, x64, b200]
    timeout-minutes: 180
    env:
      NTFM_CUDA_ONLY: "1"
      CMAKE_BUILD_PARALLEL_LEVEL: "32"
    steps:
      - uses: actions/checkout@v4
      - name: Native CUDA build
        run: make native
      - name: Repository checks
        run: make check
      - name: Build Go commands
        run: make platform
